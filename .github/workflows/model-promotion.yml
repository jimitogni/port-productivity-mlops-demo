name: Model Promotion

on:
  workflow_dispatch:
    inputs:
      mlflow_tracking_uri:
        description: Optional MLflow tracking URI override
        required: false
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Promote candidate when checks pass
        env:
          MLFLOW_TRACKING_URI: ${{ inputs.mlflow_tracking_uri || secrets.MLFLOW_TRACKING_URI }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.models.promote_model

