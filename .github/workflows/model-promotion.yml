name: Model Promotion

on:
  workflow_dispatch:
    inputs:
      mlflow_tracking_uri:
        description: >-
          Optional MLflow tracking URI override. Defaults to
          http://mlflow_server:5000 (reached over the mlflow_default Docker
          network from the self-hosted homelab runner).
        required: false
        type: string

jobs:
  promote:
    # Runs on the homelab so the promotion can reach the MLflow registry on the
    # mlflow_default Docker network. A GitHub-hosted runner cannot see it.
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Promote Candidate to Champion/Production
        env:
          # Empty -> Makefile falls back to http://mlflow_server:5000
          DOCKER_MLFLOW_TRACKING_URI: ${{ inputs.mlflow_tracking_uri }}
        run: make docker-promote-model
