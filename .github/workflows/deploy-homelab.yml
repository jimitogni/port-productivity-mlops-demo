name: Deploy Homelab

on:
  workflow_run:
    workflows: ["Build and Push Image"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment mode
        required: true
        default: ssh
        type: choice
        options:
          - ssh
          - self-hosted

permissions:
  contents: read

jobs:
  deploy-self-hosted:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'self-hosted' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with local Docker Compose
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi
          docker compose --env-file .env -f docker-compose.demo.yml pull || true
          docker compose --env-file .env -f docker-compose.demo.yml up -d --build
          curl -fsS http://127.0.0.1:80/ports-mlops/health -H 'Host: jimitogni.duckdns.org:8888'

  deploy-ssh:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'ssh') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOMELAB_SSH_KEY }}" > ~/.ssh/homelab_key
          chmod 600 ~/.ssh/homelab_key
          echo "====CONFIG SSH===="
          ssh-keyscan -p "${{ secrets.HOMELAB_SSH_PORT }}" "${{ secrets.HOMELAB_HOST }}" >> ~/.ssh/known_hosts

      - name: Package deployment files
        run: |
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='.mypy_cache' \
            --exclude='data' \
            --exclude='reports' \
            --exclude='models' \
            --exclude='mlruns' \
            -czf /tmp/port-productivity-mlops-demo.tgz .
      
      - name: Upload deployment bundle
        run: |
          echo "====SCP===="
          scp -i ~/.ssh/homelab_key -P "${{ secrets.HOMELAB_SSH_PORT }}" \
            /tmp/port-productivity-mlops-demo.tgz \
            "${{ secrets.HOMELAB_USER }}@${{ secrets.HOMELAB_HOST }}:/tmp/port-productivity-mlops-demo.tgz"
      
      - name: Deploy over SSH
        env:
          HOMELAB_SSH_PORT: ${{ secrets.HOMELAB_SSH_PORT }}
          HOMELAB_HOST: ${{ secrets.HOMELAB_HOST }}
          HOMELAB_USER: ${{ secrets.HOMELAB_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_PATH" ]; then
            echo "ERROR: DEPLOY_PATH secret is empty or not configured."
            exit 1
          fi

          ssh -i ~/.ssh/homelab_key \
            -o IdentitiesOnly=yes \
            -p "$HOMELAB_SSH_PORT" \
            "$HOMELAB_USER@$HOMELAB_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -se" <<'REMOTE'
              set -euo pipefail

              echo "====DEPLOYING APPLICATION===="
              echo "Deploy path: $DEPLOY_PATH"

              mkdir -p "$DEPLOY_PATH"
              tar --touch --no-overwrite-dir --no-same-permissions -xzf /tmp/port-productivity-mlops-demo.tgz -C "$DEPLOY_PATH"

              cd "$DEPLOY_PATH"

              # data/, reports/ and models/ are runtime bind-mount dirs that the
              # container writes to as root. They are excluded from the bundle so
              # tar never tries to chmod a root-owned dir; just ensure they exist
              # (the app's ensure_directories() recreates all subdirs on startup).
              mkdir -p data reports models

              if [ ! -f .env ]; then
                if [ -f .env.example ]; then
                  cp .env.example .env
                else
                  echo "ERROR: .env does not exist and .env.example was not found."
                  exit 1
                fi
              fi

              echo "====BUILDING AND STARTING CONTAINERS===="
              docker compose --env-file .env -f docker-compose.demo.yml up -d --build --remove-orphans

              echo "====CONTAINER STATUS===="
              docker compose --env-file .env -f docker-compose.demo.yml ps

              echo "====WAITING FOR HEALTHCHECK===="
              for i in {1..30}; do
                if curl -fsS http://127.0.0.1:80/ports-mlops/health -H 'Host: jimitogni.duckdns.org'; then
                  echo "Application is healthy"
                  exit 0
                fi

                echo "Healthcheck failed, retrying in 2 seconds..."
                sleep 2
              done

              echo "====APPLICATION LOGS===="
              docker compose --env-file .env -f docker-compose.demo.yml logs --tail=200

              echo "ERROR: Application did not become healthy."
              exit 1
          REMOTE
