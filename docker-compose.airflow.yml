x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/airflow
    AIRFLOW__WEBSERVER__BASE_URL: "https://${AIRFLOW_HOST:-airflow-jimitogni.duckdns.org}"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY:-change-me-in-production}"
    PYTHONPATH: /opt/airflow/project
    PROJECT_ROOT: /opt/airflow/project
    DATA_DIR: /opt/airflow/project/data
    REPORTS_DIR: /opt/airflow/project/reports
    MODELS_DIR: /opt/airflow/project/models
    MLFLOW_TRACKING_URI: "${AIRFLOW_MLFLOW_TRACKING_URI:-http://mlflow_server:5000}"
    _PIP_ADDITIONAL_REQUIREMENTS: "scikit-learn>=1.4,<2 mlflow>=2.13,<4 evidently>=0.4.30,<0.8 xgboost joblib>=1.3,<2 prometheus-client>=0.20,<1"
  volumes:
    - ./:/opt/airflow/project
    - ./dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
  networks:
    - airflow-internal
    - mlflow_default

services:
  airflow-postgres:
    image: postgres:16
    container_name: airflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow-internal

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: /bin/bash
    restart: "no"
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --firstname Jimi \
          --lastname Admin \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-changeme}" || true
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_WEBSERVER_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow-internal
      - mlflow_default
      - traefik_proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik_proxy}"
      # HTTP router
      traefik.http.routers.airflow-port-productivity.rule: "Host(`${AIRFLOW_HOST:-airflow-jimitogni.duckdns.org}`)"
      traefik.http.routers.airflow-port-productivity.entrypoints: "${TRAEFIK_HTTP_ENTRYPOINT:-web}"
      traefik.http.routers.airflow-port-productivity.priority: "200"
      traefik.http.services.airflow-port-productivity.loadbalancer.server.port: "8080"
      # HTTPS router
      traefik.http.routers.airflow-port-productivity-secure.rule: "Host(`${AIRFLOW_HOST:-airflow-jimitogni.duckdns.org}`)"
      traefik.http.routers.airflow-port-productivity-secure.entrypoints: "${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}"
      traefik.http.routers.airflow-port-productivity-secure.tls: "true"
      traefik.http.routers.airflow-port-productivity-secure.tls.certresolver: "${TRAEFIK_CERT_RESOLVER:-duckdns}"
      traefik.http.routers.airflow-port-productivity-secure.priority: "200"

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-postgres-data:
  airflow-logs:

networks:
  airflow-internal:
    driver: bridge
  traefik_proxy:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik_proxy}"
  mlflow_default:
    external: true
    name: mlflow_default
